<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- iOS PWA: standalone fullscreen when added to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ORCA OS" />
  <title>ORCA OS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ── Desktop ─────────────────────────────────────────────────── -->
<div id="desktop">

  <!-- Fullscreen enter button (top-right of desktop, hidden in fullscreen / mobile) -->
  <button id="fs-enter-btn" title="进入全屏" aria-label="进入全屏">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <path d="M1 5.5V1h4.5M14 5.5V1H9.5M1 9.5V14h4.5M14 9.5V14H9.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- ── Phone Shell ──────────────────────────────────────────── -->
  <div id="phone">
    <!-- Physical buttons (decorative) -->
    <div class="phone-btn btn-vol-up"></div>
    <div class="phone-btn btn-vol-dn"></div>
    <div class="phone-btn btn-side"></div>

    <!-- ── Screen ───────────────────────────────────────────────── -->
    <div id="screen">

      <!-- Status Bar -->
      <div id="status-bar">
        <span id="status-time">9:41</span>
        <div id="dynamic-island"><div id="di-inner"></div></div>
        <!-- Exit-fullscreen pill (appears left of Dynamic Island in fullscreen mode) -->
        <button id="fs-exit-pill" title="退出全屏" aria-label="退出全屏">
          <svg width="11" height="11" viewBox="0 0 11 11"><line x1="1.5" y1="1.5" x2="9.5" y2="9.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/><line x1="9.5" y1="1.5" x2="1.5" y2="9.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div id="status-right">
          <span class="si-signal">
            <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="6" width="3" height="6" rx="1" fill="white" opacity=".4"/><rect x="4.5" y="4" width="3" height="8" rx="1" fill="white" opacity=".6"/><rect x="9" y="2" width="3" height="10" rx="1" fill="white" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="white"/></svg>
          </span>
          <span class="si-wifi">
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="white"/><path d="M8 6.5C9.9 6.5 11.6 7.3 12.8 8.6l1.4-1.4A8.4 8.4 0 008 5a8.4 8.4 0 00-6.2 2.2L3.2 8.6A6.4 6.4 0 018 6.5z" fill="white" opacity=".6"/><path d="M8 2.5C11 2.5 13.7 3.8 15.6 5.9l1.4-1.4A12 12 0 008 .5a12 12 0 00-9 4l1.4 1.4A10 10 0 018 2.5z" fill="white" opacity=".3"/></svg>
          </span>
          <span class="si-battery">
            <svg width="25" height="12" viewBox="0 0 25 12">
              <rect x="0" y="1" width="21" height="10" rx="3" stroke="white" stroke-width="1.2" fill="none" opacity=".7"/>
              <rect x="22" y="4" width="3" height="4" rx="1.5" fill="white" opacity=".5"/>
              <rect x="1.5" y="2.5" width="17" height="7" rx="2" fill="white"/>
            </svg>
          </span>
        </div>
      </div>
      <div id="control-grab-zone" aria-hidden="true"></div>

      <!-- Home Screen -->
      <div id="home-screen">
        <canvas id="wallpaper-canvas"></canvas>
        <div id="home-pages-wrap">
          <div id="home-pages"><!-- pages injected --></div>
        </div>
        <div id="page-dots"><!-- injected --></div>
        <div id="dock">
          <div id="dock-blur"></div>
          <div id="dock-icons"><!-- injected --></div>
        </div>
      </div>

      <!-- App Layer (all app windows) -->
      <div id="app-layer"><!-- windows injected --></div>

      <!-- App Switcher -->
      <div id="app-switcher" class="hidden">
        <div id="switcher-cards"></div>
      </div>

      <!-- Notification Layer -->
      <div id="notif-layer"></div>

      <!-- Control Center -->
      <div id="control-center" class="hidden">
        <div id="control-center-mask"></div>
        <div id="control-center-panel">
          <div class="cc-top">
            <div>
              <div id="cc-date" class="cc-date"></div>
              <div id="cc-time" class="cc-time"></div>
            </div>
            <div class="cc-network">
              <div class="cc-network-label">ORCA OS</div>
              <div class="cc-network-sub">局域网 / 本地模拟</div>
            </div>
          </div>

          <div class="cc-grid">
            <button class="cc-tile cc-toggle is-on" data-toggle="wifi">
              <span class="cc-tile-icon">📶</span>
              <span class="cc-tile-label">Wi-Fi</span>
            </button>
            <button class="cc-tile cc-toggle is-on" data-toggle="bluetooth">
              <span class="cc-tile-icon">🟦</span>
              <span class="cc-tile-label">蓝牙</span>
            </button>
            <button class="cc-tile cc-toggle" data-toggle="airplane">
              <span class="cc-tile-icon">✈️</span>
              <span class="cc-tile-label">飞行模式</span>
            </button>
            <button class="cc-tile cc-toggle" data-toggle="focus">
              <span class="cc-tile-icon">🌙</span>
              <span class="cc-tile-label">专注</span>
            </button>
          </div>

          <div class="cc-sliders">
            <div class="cc-slider-card">
              <div class="cc-slider-label">亮度</div>
              <input id="cc-brightness" type="range" min="25" max="100" value="78" />
            </div>
            <div class="cc-slider-card">
              <div class="cc-slider-label">音量</div>
              <input id="cc-volume" type="range" min="0" max="100" value="46" />
            </div>
          </div>

          <div class="cc-bottom">
            <div class="cc-chip" id="cc-chip-wifi">Wi-Fi: ORCA-LAN</div>
            <div class="cc-chip" id="cc-chip-bluetooth">蓝牙: 已开启</div>
            <div class="cc-chip">设备: ORCA Pro Max</div>
          </div>
        </div>
      </div>

      <!-- 小艺 Floating Bubble -->
      <div id="xiaoyi-bubble" title="小艺助手">
        <div class="bubble-ring"></div>
        <div class="bubble-core">✨</div>
      </div>

      <!-- 小艺 Panel -->
      <div id="xiaoyi-panel" class="hidden">
        <div id="xiaoyi-mask"></div>
        <div id="xiaoyi-body">
          <div id="xiaoyi-drag-bar"></div>
          <div id="xiaoyi-header">
            <div class="xh-left">
              <div class="xh-avatar">✨</div>
              <div>
                <div class="xh-name">小艺</div>
                <div class="xh-sub">ORCA 智能助手</div>
              </div>
            </div>
            <button id="xiaoyi-close" aria-label="关闭">
              <svg width="18" height="18" viewBox="0 0 18 18"><line x1="2" y1="2" x2="16" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="2" x2="2" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="xiaoyi-messages">
            <div class="xm xm-ai">
              <div class="xm-bubble">
                您好！我是小艺，您的智能助手 ✨<br>
                有什么可以帮您的吗？
              </div>
            </div>
          </div>
          <div id="xiaoyi-input-row">
            <input id="xiaoyi-input" type="text" placeholder="向小艺提问…" autocomplete="off" />
            <button id="xiaoyi-send">
              <svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 9L16 2l-7 14V10H2z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Home Indicator -->
      <div id="home-bar">
        <div id="home-pill"></div>
      </div>

    </div><!-- /screen -->
  </div><!-- /phone -->

</div><!-- /desktop -->

<script src="/main.js"></script>
</body>
</html>
